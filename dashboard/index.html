  <!-- Top Navigation Bar -->
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <span class="brand__mark" aria-label="LanceUp Logo">
          <svg class="brand__logo-svg" viewBox="0 0 24 24" width="18" height="18" fill="none">
            <path d="M6 4v8a6 6 0 0 0 12 0V4" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <h1 class="brand__name">LanceUp</h1>
      </div>

      <div class="topbar__actions">
        <button type="button" class="btn btn--secondary" id="btnScanNow" title="Quét lại việc làm từ các sàn đã chọn">
          <svg class="icon icon--sm" aria-hidden="true"><use href="#i-refresh-cw"/></svg>
          <span>Quét việc làm</span>
        </button>

        <button type="button" class="btn btn--secondary" id="btnExport" title="Xuất hoặc nhập cấu hình bộ lọc ra YAML/JSON để chia sẻ với đồng đội">
          <svg class="icon icon--sm" aria-hidden="true"><use href="#i-download"/></svg>
          <span style="display: inline-block;">Chia sẻ bộ lọc</span>
        </button>

        <button type="button" class="btn btn--secondary btn--icon" id="themeToggle" title="Chuyển đổi giao diện Sáng / Tối" aria-label="Chuyển đổi giao diện">
          <svg class="icon icon--md" aria-hidden="true"><use href="#i-sun"/></svg>
        </button>

        <button type="button" class="btn btn--secondary btn--icon" id="btnMobileFilterToggle" title="Đóng / mở bộ lọc" aria-label="Bộ lọc" style="display: none;">
          <svg class="icon icon--md" aria-hidden="true"><use href="#i-sliders-horizontal"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main 2-Column Layout -->
  <div class="layout">
    <!-- Filter Sidebar Mount Target -->
    <div id="sidebarMount"></div>

    <!-- Job Feed Main Container -->
    <main class="feed" id="mainFeed">
      <div style="display: flex; flex-direction: column; gap: var(--space-1);">
        <h2 class="title">Freelance <span class="title__accent">Jobs</span></h2>
        <p class="caption">Lọc & quét từ 12 sàn toàn cầu • Chấm điểm 0-100 • Kết quả thực thời</p>
      </div>

      <!-- Stats Bar (4 columns) -->
      <dl class="stats">
        <div class="stat">
          <dt>
            <svg class="icon icon--xs" aria-hidden="true"><use href="#i-inbox"/></svg>
            <span>Tổng số việc làm</span>
          </dt>
          <dd id="statTotal">—</dd>
        </div>

        <div class="stat">
          <dt>
            <svg class="icon icon--xs" style="color: var(--color-success-text);" aria-hidden="true"><use href="#i-circle-check"/></svg>
            <span>Đạt yêu cầu</span>
          </dt>
          <dd id="statPassed" style="color: var(--color-success-text);">—</dd>
        </div>

        <div class="stat">
          <dt>
            <svg class="icon icon--xs" style="color: var(--color-danger-text);" aria-hidden="true"><use href="#i-circle-x"/></svg>
            <span>Bị loại</span>
          </dt>
          <dd id="statDiscarded" style="color: var(--color-danger-text);">—</dd>
        </div>

        <div class="stat">
          <dt>
            <svg class="icon icon--xs" aria-hidden="true"><use href="#i-star"/></svg>
            <span>Điểm trung bình</span>
          </dt>
          <dd id="statAverage">—</dd>
        </div>
      </dl>

      <!-- Feed Controls Toolbar -->
      <div class="toolbar">
        <div class="segmented" role="tablist" aria-label="Bộ lọc chế độ xem">
          <button type="button" class="segmented__btn is-active" data-scope="all" role="tab" aria-selected="true">
            Tất cả
          </button>
          <button type="button" class="segmented__btn" data-scope="saved" role="tab" aria-selected="false">
            <svg class="icon icon--xs" aria-hidden="true"><use href="#i-star"/></svg>
            <span>Đã lưu</span>
            <span id="countSaved" style="margin-left: 0.25rem; font-size: var(--text-xs); opacity: 0.85;"></span>
          </button>
          <button type="button" class="segmented__btn" data-scope="hidden" role="tab" aria-selected="false">
            <svg class="icon icon--xs" aria-hidden="true"><use href="#i-eye-off"/></svg>
            <span>Đã ẩn</span>
            <span id="countHidden" style="margin-left: 0.25rem; font-size: var(--text-xs); opacity: 0.85;"></span>
          </button>
        </div>

        <div class="toolbar__group">
          <div style="display: flex; align-items: center; gap: var(--space-2);">
            <label for="selectSort" class="caption" style="white-space: nowrap;">Sắp xếp:</label>
            <select id="selectSort" class="input" style="height: 2rem; padding: 0 var(--space-2); font-size: var(--text-xs); width: auto;">
              <option value="score">Điểm cao nhất</option>
              <option value="budget">Ngân sách cao nhất</option>
              <option value="latest">Mới đăng nhất</option>
              <option value="bids">Ít bid nhất</option>
            </select>
          </div>

          <label style="display: inline-flex; align-items: center; gap: var(--space-2); cursor: pointer; user-select: none;">
            <input type="checkbox" id="chkShowDiscarded" style="accent-color: var(--color-accent);" />
            <span class="label" style="font-size: var(--text-xs); color: var(--color-text-muted);">Hiện job bị loại</span>
          </label>
        </div>
      </div>

      <!-- Feed Content / Job Cards Container -->
      <div id="jobsContainer"></div>
    </main>
  </div>

  <!-- Main ES Module Script -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
